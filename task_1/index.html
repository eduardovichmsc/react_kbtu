<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Async JS Homework</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Task Manager</h1>
      <div id="tasks-container"></div>

      <div class="controls">
        <button id="run-all-btn">Run All Tasks</button>
        <button id="compare-btn">Compare Sequential vs Concurrent</button>
        <button id="event-loop-btn">Run Event Loop Demo</button>
      </div>

      <div id="status-message"></div>

      <div class="demo-output">
        <h3>Console Output:</h3>
        <pre id="console-output"></pre>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
